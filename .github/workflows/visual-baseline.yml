name: Update visual baselines

# Run this from the Actions tab, on the branch whose screenshots should become the new baselines.
# Baselines must be rendered on Linux (here), never on a developer machine.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    name: Render and commit baselines
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Storybook
        run: pnpm exec turbo run build --filter=@ohseungik/maru-docs

      - name: Install the browser
        run: pnpm --filter @ohseungik/maru-docs exec playwright install --with-deps chromium

      - name: Render baselines
        run: pnpm --filter @ohseungik/maru-docs test:visual:update

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/docs/visual
          if git diff --cached --quiet; then
            echo "Baselines are already up to date."
          else
            git commit -m "test(visual): update baselines"
            git push
          fi
